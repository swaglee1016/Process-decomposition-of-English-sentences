<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Sentences Process Decomposition - Local Reader</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233498db'/%3E%3Cpath d='M16 18h32v6H16zm0 11h24v6H16zm0 11h32v6H16z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="inlineDiagramCanvas.css">
  <link rel="stylesheet" href="parallelReading.css">
  <link rel="stylesheet" href="epubOriginal.css">
</head>
<body>
  <section class="input-bar" id="inputBar">
    <button class="input-bar-header" id="inputBarHeader" type="button" aria-expanded="false" aria-controls="inputBarBody">
      <span class="input-bar-icon">文章输入</span>
      <span>粘贴英文文章或上传文件</span>
      <span class="input-bar-arrow" id="inputArrow">▼</span>
    </button>
    <div class="input-bar-body" id="inputBarBody">
      <textarea id="textInput" placeholder="在这里粘贴英文文章……"></textarea>
      <label class="mode-control">输入格式 <select id="paragraphMode"><option value="pdf">PDF 复制文本：修复折行与分段</option><option value="preserve">保留现有换行与段落</option></select></label>
      <div class="file-row">
        <div class="file-zone" id="dropZone">
          <button class="btn-small" id="fileBtn" type="button">选择文件</button>
          <span id="fileName">支持 TXT、PDF、EPUB 小说，也可以拖到这里</span>
          <input id="fileInput" type="file" accept=".txt,.pdf,.epub,text/plain,application/pdf,application/epub+zip" hidden>
        </div>
        <button class="btn-primary" id="processBtn" type="button">整理分段并预览</button>
      </div>
    </div>
  </section>

  <details id="recentReading" class="recent-reading">
    <summary>最近阅读</summary>
    <p id="recentReadingStatus" role="status"></p>
    <div id="recentReadingItems" class="recent-reading-items"></div>
  </details>

  <section id="epubPanel" class="epub-panel" hidden aria-label="EPUB 目录">
    <div class="preview-toolbar">
      <button id="epubToggle" class="epub-toggle" type="button" aria-expanded="true" aria-controls="epubToc"><strong id="epubTitle"></strong><span class="epub-toggle-arrow" id="epubToggleArrow">▲</span></button>
      <span id="epubHint">点击章节直接载入；或勾选多个章节后一起载入</span>
      <button id="loadSelectedBtn" class="btn-primary" type="button" disabled>载入选中章节</button>
    </div>
    <div class="epub-ai-actions"><p id="epubAiStatus" class="epub-notice" role="status" hidden></p><button id="epubAiRetry" class="btn-small" type="button" hidden>重试生成 AI 目录</button><a id="epubAiDownload" class="btn-small" download hidden>下载带 AI 目录的 EPUB</a></div>
    <p id="epubWarnings" class="epub-notice" role="status" hidden></p>
    <div id="epubToc" class="epub-toc"></div>
    <div id="epubCandidates" class="epub-review" hidden></div>
    <div id="epubReading" class="epub-reading" hidden>
      <button id="epubReadBtn" class="btn-small" type="button">打开阅读预览</button>
      <span id="epubReadingHint"></span>
      <details id="epubMaterials"><summary>按书内材料分别预览</summary><div id="epubMaterialList"></div></details>
    </div>
  </section>

  <section id="previewPanel" class="preview-panel" hidden aria-label="分段预览">
    <div class="preview-toolbar"><button id="previewToggle" class="epub-toggle" type="button" aria-expanded="true" aria-controls="previewBody"><strong>检查分段</strong><span id="previewToggleArrow" class="epub-toggle-arrow">▲</span></button><span id="previewSummary"></span><button id="undoPreview" type="button" disabled>撤销调整</button><button id="analyzeBtn" type="button" class="btn-primary">确认分段并分析</button></div>
    <div id="previewBody" class="preview-body">
    <p class="preview-hint">确认对话和段落边界；需要时点击“此处换段”或“合并上一段”。调整只影响分段，不改原文。</p>
    <p id="previewWarnings" role="status"></p><div id="previewContent"></div>
    </div>
  </section>
  <section class="progress-wrap" aria-live="polite">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
    <span id="statusText">等待输入</span>
    <span class="time-estimate" id="timeEstimate"></span>
  </section>

  <main class="dual-panel" id="dualPanel">
    <section class="panel-left">
      <div class="reading-mode-bar" id="readingModeBar" hidden><button id="readingModeToggle" type="button" aria-pressed="false">切换至 EPUB 原版</button><span class="reading-mode-status" id="readingModeStatus" role="status"></span></div>
      <header class="panel-header reading-header" id="readingHeader"><span>英文原文</span><span>中文翻译</span></header>
      <div class="panel-left-content" id="leftContent">
        <p class="placeholder">处理完成后，完整文章会显示在这里。</p>
      </div>
      <div id="originalContent" hidden></div>
    </section>
    <section class="panel-right" id="panelRight">
      <header class="panel-header">句子拆解与思维导图</header>
      <div class="panel-right-content" id="rightContent">
        <p class="placeholder">每个句子的分析和流程图会显示在这里。</p>
      </div>
    </section>
  </main>

  <footer class="toolbar">
    <div>
      <span class="toolbar-hint">点击左侧句子可跳转到右侧对应分析。</span>
      <span class="save-path" id="savePath"></span>
      <label class="column-control">原文与译文栏宽 <input id="columnWidth" type="range" min="25" max="60" value="40" aria-label="原文与译文栏宽"></label>
    </div>
    <div class="toolbar-actions"><span id="sessionStatus" role="status"></span><button class="btn-small" id="resumeAnalysisBtn" type="button" hidden>继续上次分析</button><button class="btn-small" id="collapsePanelsBtn" type="button">收起输入与预览</button><button class="btn-download" id="downloadBtn" type="button" style="display:none">打开保存的完整 HTML</button></div>
  </footer>

  <script src="studyShared.js"></script>
  <script src="inlineDiagramCanvas.js"></script>
  <script src="studyNavigation.js"></script>
  <script src="epubOriginal.js"></script>
  <link rel="stylesheet" href="vocabulary.css">
  <script src="vocabularyShared.js"></script>
  <script src="vocabulary.js"></script>
  <link rel="stylesheet" href="readingWorkspace.css">
  <script src="readingWorkspace.js"></script>
  <script src="readerSession.js"></script>
  <script src="app.js"></script>
</body>
</html>
